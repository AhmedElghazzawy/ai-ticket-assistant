# Runs on every push to main and every pull request: a fresh machine installs the
# project from the lockfile and runs every check. No API key: tests never call Gemini.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only needs to read the code.
permissions:
  contents: read

# A newer push to the same branch cancels the older, now pointless run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (lint, types, tests)
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest moves to 26 on 2026-10-19; upgrade on purpose
    timeout-minutes: 10
    # Tests run against a real Postgres, the same image (pinned by digest) as compose.yaml.
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg18-trixie@sha256:9d9c930220cb9bf2f956d10a8f909cf9973d9672ca0278aef2c1e6facccad2e0
        env:
          POSTGRES_USER: helpdesk
          POSTGRES_PASSWORD: ci-only # a throwaway database that only lives during this run
          POSTGRES_DB: helpdesk
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U helpdesk"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://helpdesk:ci-only@127.0.0.1:5433/helpdesk
    steps:
      # Actions are pinned to a commit SHA (a tag can be moved by an attacker; a SHA cannot).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.23" # same uv as on my laptop
          python-version: "3.12"
          enable-cache: true

      - name: Install exactly what uv.lock says
        run: uv sync --locked

      - name: Lint (ruff)
        run: uv run ruff check --output-format=github

      - name: Format check (ruff)
        run: uv run ruff format --check

      - name: Type check (mypy strict)
        run: uv run mypy

      - name: Tests (pytest)
        run: uv run pytest

      - name: API schema is up to date (frontend/openapi.json)
        run: uv run python tools/export_openapi.py && git diff --exit-code frontend/openapi.json

  frontend:
    name: Frontend (lint, types, build, browser tests)
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest moves to 26 on 2026-10-19; upgrade on purpose
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.21.0" # same Node LTS as on my laptop
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install exactly what package-lock.json says
        run: npm ci

      - name: Lint and format (Biome)
        run: npx biome ci .

      - name: Type check (TypeScript strict)
        run: npm run typecheck

      - name: Generated API client is up to date (src/client)
        run: npm run generate && git diff --exit-code src/client

      - name: Production build
        run: npm run build

      - name: Browser for Playwright (Chromium only)
        run: npx playwright install --with-deps chromium

      - name: Browser tests (Playwright, API faked, desktop + phone)
        run: npm run test:e2e

  docker:
    name: Docker image builds
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest moves to 26 on 2026-10-19; upgrade on purpose
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the production image (not pushed anywhere)
        run: docker build --tag helpdesk:ci .
