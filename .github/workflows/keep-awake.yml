# Render's free plan puts the app to sleep after ~15 minutes without visitors; the next visitor then
# waits ~30 s while it wakes up. A request every 10 minutes keeps it awake. /api/health does not
# touch the database, so Neon (the free Postgres) still sleeps and saves its compute hours.
# Limits: GitHub may start a scheduled run some minutes late, and it turns schedules off after
# 60 days without activity in the repo. Free Render hours: 750 a month per workspace; one service
# awake all month uses ~744.
name: Keep the demo awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: # a manual "Run workflow" button, to test it

# It only sends one request: it needs no access to the repository.
permissions: {}

jobs:
  ping:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Open the health check
        run: curl --fail --silent --show-error --max-time 90 --retry 2 https://bseu-helpdesk.onrender.com/api/health
