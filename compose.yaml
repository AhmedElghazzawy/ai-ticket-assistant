# One command for the whole system: docker compose up --build    then open http://127.0.0.1:8000
services:
  app:
    build: .
    env_file: .env # the API key is read when the container starts; it is never inside the image
    ports:
      - "127.0.0.1:8000:8000" # only this computer can reach it (not others on the same Wi-Fi)
    volumes:
      - helpdesk-data:/app/var # tickets survive restarts and rebuilds
    restart: unless-stopped

volumes:
  helpdesk-data:
