# One command for the whole system: docker compose up --build    then open http://127.0.0.1:8000
services:
  db:
    # Postgres 18 with pgvector (vector search inside the database), like Neon in production.
    image: pgvector/pgvector:0.8.7-pg18-trixie@sha256:9d9c930220cb9bf2f956d10a8f909cf9973d9672ca0278aef2c1e6facccad2e0
    environment:
      POSTGRES_USER: helpdesk
      POSTGRES_PASSWORD: local-only # only reachable from this computer; production uses Neon
      POSTGRES_DB: helpdesk
    ports:
      - "127.0.0.1:5433:5432" # 5433 on this computer (5432 is used by another project)
    volumes:
      - postgres-data:/var/lib/postgresql # tickets survive restarts and rebuilds
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helpdesk"]
      interval: 2s
      timeout: 3s
      retries: 20

  app:
    build: .
    env_file: .env # the API key is read when the container starts; it is never inside the image
    environment:
      DATABASE_URL: postgresql://helpdesk:local-only@db:5432/helpdesk
      DEMO_MODE: ${DEMO_MODE:-false} # DEMO_MODE=true docker compose up: the one-click staff demo
    ports:
      - "127.0.0.1:8000:8000" # only this computer can reach it (not others on the same Wi-Fi)
    depends_on:
      db:
        condition: service_healthy # start the app only when the database answers
    restart: unless-stopped

volumes:
  postgres-data:
