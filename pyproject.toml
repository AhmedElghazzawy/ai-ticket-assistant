[project]
name = "ai-ticket-assistant"
version = "0.7.0"
description = "Bilingual (TR/EN) university helpdesk assistant: classify, retrieve, draft a cited reply, auto-send or route to a human."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "argon2-cffi>=25.1.0",        # staff passwords hashed with Argon2id (OWASP recommendation)
    "google-genai>=2.28.0",       # talk to Gemini models
    "psycopg[binary,pool]>=3.3.6", # Postgres driver and connection pool (the ticket database)
    "pydantic>=2.13.5",           # check that every ticket has valid fields and labels
    "pydantic-settings>=2.15.0",  # typed settings from environment variables and .env
    "structlog>=26.1.0",          # structured logs: one JSON line per event
    "fastapi>=0.143.0",           # the web API behind the student chat page
    "uvicorn>=0.54.0",            # the server that runs the FastAPI app
]

[build-system]
# uv's own build backend: the code in src/helpdesk is installed as the package `helpdesk`
# (editable, so a code change needs no reinstall). Imports are `from helpdesk.domain import ...`.
requires = ["uv_build>=0.12.23,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "helpdesk"

[dependency-groups]
# The old Streamlit panel (overview, dataset, evaluation): not in the production image.
panel = [
    "streamlit>=1.65.0",
]
# Tools for developers and CI only; not installed in the production image.
dev = [
    "pytest>=9.1.1",    # automatic tests (tests/)
    "httpx2>=2.13.1",   # needed by FastAPI's TestClient
    "ruff>=0.17.0",     # linter and formatter
    "mypy>=2.4.0",      # static type checker
    "pytest-cov>=7.0.0", # test coverage: which lines the tests run
]

[tool.uv]
default-groups = ["dev", "panel"]  # `uv sync` on a laptop or in CI installs both

[tool.pytest.ini_options]
testpaths = ["tests"]
# The package is installed (editable), but on macOS a background process can mark the .venv files
# "hidden", and Python 3.12 then skips the .pth file that points to src/. Naming src/ here keeps
# the tests independent of that.
pythonpath = ["src"]

[tool.coverage.run]
source = ["helpdesk"]
# Not measured: the old Streamlit panel (to be retired, roadmap 12) and a manual script that calls the
# real model (now tools/try_one_ticket.py, outside the package). Everything else counts, including the
# eval scripts' main() functions.
omit = ["*/helpdesk/panel.py"]

[tool.coverage.report]
fail_under = 80  # a ratchet: raise it when coverage rises, never lower it to get green
skip_empty = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle: basic style errors and warnings
    "F",       # pyflakes: unused imports, undefined names, real bugs
    "I",       # isort: imports in a fixed, sorted order
    "B",       # flake8-bugbear: common bug patterns
    "UP",      # pyupgrade: use modern Python 3.12 syntax
    "SIM",     # flake8-simplify: simpler equivalent code
    "ISC",     # implicit string concatenation (the bug we found in app.py)
]
ignore = [
    "E501",  # line length is handled by the formatter; long prompt strings stay intact
]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests", "tools", ".claude/hooks"]
mypy_path = "src"  # same reason as pytest's pythonpath
strict = true       # every function typed, no silent "Any"
plugins = ["pydantic.mypy"]  # lets mypy understand pydantic models and settings
