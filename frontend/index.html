<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="BŞEÜ Öğrenci Yardım Masası: resmî belgelere dayanan yapay zekâ destekli asistan." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>BŞEÜ Öğrenci Yardım Masası</title>
    <script>
      // Apply dark mode before the page paints, so dark-mode users never see a white flash.
      try {
        const theme = localStorage.getItem("theme") || "dark"; // dark by default (design choice, 2026-10-23)
        const dark = theme === "dark" || (theme === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
