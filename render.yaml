# Render Blueprint: the whole app, free plan, Frankfurt (EU, the closest region to Turkey).
# Render builds the Dockerfile from this repository. The Gemini key is entered once in Render's
# dashboard (sync: false), never written in this file.
# Note: the live service was created with the Render CLI, not from this Blueprint, so Render does not
# apply changes here by itself; its dashboard values win. Anything the live site must have is in code.
services:
  - type: web
    name: bseu-helpdesk
    runtime: docker
    plan: free # sleeps after ~15 min without visitors; the next visit wakes it (about a minute)
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass # deploy a new commit only after GitHub CI passed
    envVars:
      - key: GEMINI_API_KEY
        sync: false # secret: typed into Render's dashboard
      - key: DATABASE_URL
        sync: false # secret: Neon's connection string (free Postgres, EU), typed into Render's dashboard
      # Measured on the 80 dev tickets (ADR 0015): 0 missed escalations, as accurate as
      # gemini-3.5-flash-lite within the 95% intervals, and it answered while that one was overloaded.
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      # The live time limit (12 s, one try, then the backup) is in code: LIVE_LIMITS in ai/gemini.py.
      # When the main model is overloaded (503 "high demand"), ask this one instead. Free tier.
      - key: GEMINI_FALLBACK_MODEL
        value: gemini-3.5-flash-lite
      - key: PORT
        value: "8000" # the port our container listens on
      - key: DEMO_MODE
        value: "true" # the "Try the demo" button: sample tickets only, never real ones
      - key: CLIENT_IP_HEADER
        value: CF-Connecting-IP # set by Cloudflare in front of Render; X-Forwarded-For can be faked
      - key: DAILY_TICKET_CAP
        value: "300"
